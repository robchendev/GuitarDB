<header class="header-container">
  <div class="start">
    <app-menu-button (menuClick)="onOpenSidebar()" [transparent]="true" />
    <h1>GuitarDB</h1>
    @switch (role) {
      @case ("admin") {
        <div class="badge">Admin</div>
      }
      @case ("mod") {
        <div class="badge">Mod</div>
      }
    }
  </div>
  <div class="end">
    <app-user-handle />
  </div>
</header>
