<div
  class="backdrop"
  [class.show]="sidebarService.isOpen()"
  (click)="sidebarService.close()"
></div>
<nav class="sidebar" [class.open]="sidebarService.isOpen()">
  <div class="start">
    <app-menu-button (menuClick)="sidebarService.close()" />
    <h1>GuitarDB</h1>
  </div>
  <div class="center">
    <ul>
      <app-link-button routerLink="/" [icon]="homeIcon">Home</app-link-button>
      <app-link-button routerLink="/users" [icon]="usersIcon">
        Users
      </app-link-button>
      <app-link-button routerLink="/guitars" [icon]="guitarIcon">
        Guitars
      </app-link-button>
      <app-link-button routerLink="/restricted" [icon]="shieldIcon">
        Restricted
      </app-link-button>
      <app-link-button
        routerLink="/invalid-link-example"
        [icon]="placeholderIcon"
      >
        Non Mainframe
      </app-link-button>
      <app-link-button routerLink="/sandbox" [icon]="placeholderIcon">
        Development Sandbox
      </app-link-button>
      <app-link-button routerLink="/lorem-ipsum" [icon]="placeholderIcon">
        Lorem Ipsum
      </app-link-button>
    </ul>
  </div>
  <hr />
  <ng-container *appHasRole="['Admin']">
    <div class="center">
      <h4>Admin</h4>
      <ul>
        <app-link-button routerLink="/admin/users" [icon]="userManagerIcon">
          User Manager
        </app-link-button>
        <app-link-button routerLink="/admin/guitars" [icon]="placeholderIcon">
          Guitar Manager
        </app-link-button>
      </ul>
    </div>
    <hr />
  </ng-container>
  <div class="end">Footer... To do...</div>
</nav>
