<div class="container">
  <form
    [formGroup]="registerForm"
    (ngSubmit)="onCreateAccount()"
    autocomplete="off"
  >
    <div>
      <h1>GuitarDB</h1>
      <h2>Create account</h2>
    </div>
    <!-- <input formControlName="email" placeholder="Email" /> -->
    <app-text-input
      label="Username"
      formControlName="username"
      [errorMessages]="{
        required: 'Please enter a username',
        minlength: 'Username must be at least 3 characters',
        maxlength: 'Username must be at most 20 characters',
        pattern: 'Username can only contain letters, numbers and hyphens (-)',
      }"
    />
    <app-text-input
      label="Password"
      formControlName="password"
      type="password"
      autocomplete="new-password"
      [errorMessages]="{
        required: 'Please enter a password',
        minlength: 'Password must be at least 8 characters',
        maxlength: 'Password must be at most 64 characters',
      }"
    />
    <app-text-input
      label="Confirm Password"
      formControlName="confirmPassword"
      type="password"
      autocomplete="new-password"
      [errorMessages]="{
        required: 'Please enter a confirm password',
        matchValues: 'Passwords must match',
      }"
    />

    @if (validationErrors) {
      <div>
        @for (error of validationErrors; track $index) {
          <p>Error: {{ validationErrors }}</p>
        }
      </div>
    }

    <div class="bottom-row">
      <app-form-cta-button
        text="Create account"
        variant="primary"
        type="submit"
        [disabled]="loadingService.isLoadingId('create-account')"
      />
    </div>
  </form>
</div>
