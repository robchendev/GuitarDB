<div>
  <form
    [formGroup]="createGuitarForm"
    (ngSubmit)="onCreateGuitar()"
    autocomplete="off"
  >
    <div>
      <h1>GuitarDB</h1>
      <h2>Create guitar</h2>
    </div>
    <app-text-input
      label="Name"
      formControlName="name"
      [errorMessages]="{
        required: 'Please enter a name',
        maxlength: 'Name must be at most 100 characters',
      }"
      [showErrors]="submitted"
    />
    <app-text-input
      label="Alias"
      formControlName="alias"
      [errorMessages]="{
        maxlength: 'Aliases combined must be at most 200 characters',
      }"
      [showErrors]="submitted"
    />
    <app-text-input
      label="Location Address"
      formControlName="locationAddress"
      [errorMessages]="{
        maxlength: 'Location Address must be at most 200 characters',
      }"
      [showErrors]="submitted"
    />
    <app-text-input
      label="Location Latitude"
      formControlName="latitude"
      type="number"
      [errorMessages]="{
        requireOtherMismatch:
          'Latitude must be provided if longitude is provided.',
        min: 'Latitude must be higher than or equal to -90.',
        max: 'Latitude must be lower than or equal to 90.',
      }"
      [showErrors]="submitted"
    />
    <app-text-input
      label="Location Longitude"
      formControlName="longitude"
      type="number"
      [errorMessages]="{
        requireOtherMismatch:
          'Longitude must be provided if Latitude is provided.',
        min: 'Longitude must be higher than or equal to -180.',
        max: 'Longitude must be lower than or equal to 180.',
      }"
      [showErrors]="submitted"
    />
    <app-text-input
      label="Website URL"
      formControlName="websiteUrl"
      [errorMessages]="{
        maxlength: 'Website URL must be at most 300 characters',
        pattern: 'Website URL must be valid and start with https:// or http://',
      }"
      [showErrors]="submitted"
    />
    <app-text-area
      label="Description"
      formControlName="description"
      [errorMessages]="{
        maxlength: 'Description must be at most 2000 characters',
      }"
    />
    <div>
      Description Length:
      {{ createGuitarForm.get("description")?.value?.length || 0 }}/2000
    </div>

    <app-text-area
      label="Comment (briefly describe why this change is needed)"
      formControlName="comment"
      [errorMessages]="{
        required: 'Please enter a comment',
        maxlength: 'Comment must be at most 300 characters',
      }"
      [rows]="4"
    />
    <div>
      Comment Length:
      {{ createGuitarForm.get("comment")?.value?.length || 0 }}/300
    </div>

    @if (validationErrors) {
      <div>
        @for (error of validationErrors; track $index) {
          <p>Error: {{ validationErrors }}</p>
        }
      </div>
    }

    <div class="bottom-row">
      <app-form-cta-button
        text="Create guitar"
        variant="primary"
        type="submit"
        [disabled]="loadingService.isLoadingId('create-guitar') || isDataEmpty"
      />
    </div>
  </form>
</div>
